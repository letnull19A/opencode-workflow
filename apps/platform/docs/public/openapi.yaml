openapi: 3.0.3
info:
  title: opencode-workflow HTTP API
  description: |
    Webhook API of the module-development orchestrator. Drives opencode
    sessions (one-off runs, module pipeline by name) and ingests tasks.
    All responses are JSON.
  version: 1.0.0
servers:
  - url: http://localhost:8787
    description: local webhook (PORT env)
tags:
  - name: System
  - name: Run
  - name: Tasks
  - name: Modules
  - name: Hooks
  - name: Stream

paths:
  /health:
    get:
      tags: [System]
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                    const: true
                    example: true

  /agents:
    get:
      tags: [System]
      summary: List agents known to the opencode server
      operationId: listAgents
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: object
                required: [ok, agents]
                properties:
                  ok:
                    type: boolean
                  agents:
                    type: array
                    items:
                      type: string
                    example: ["build", "unit-test", "refactor"]
        "500":
          $ref: "#/components/responses/ServerError"

  /run:
    get:
      tags: [Run]
      summary: One-off agent run (workflow prompt), agent via query
      operationId: runGet
      parameters:
        - name: agent
          in: query
          required: false
          schema:
            type: string
            example: refactor
      responses:
        "200":
          description: Completed agent session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400":
          $ref: "#/components/responses/UnknownAgent"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Run]
      summary: One-off agent run (workflow prompt), agent via body
      operationId: runPost
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                agent:
                  type: string
                  example: build
      responses:
        "200":
          description: Completed agent session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400":
          $ref: "#/components/responses/UnknownAgent"
        "500":
          $ref: "#/components/responses/ServerError"

  /task:
    post:
      tags: [Tasks]
      summary: Ingest a task into the event bus (publishes task.received)
      operationId: ingTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: Task accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, received]
                properties:
                  ok:
                    type: boolean
                  received:
                    type: string
                    description: task externalId
                    example: t-42
        "400":
          description: Missing externalId/title or invalid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflows:
    get:
      tags: [Workflows]
      summary: List registered workflows (module + custom from WORKFLOWS_DIR)
      operationId: listWorkflows
      responses:
        "200":
          description: Workflow summaries (id/label/phases) for dashboards and hook forms
          content:
            application/json:
              schema:
                type: object
                required: [ok, workflows]
                properties:
                  ok:
                    type: boolean
                  workflows:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkflowSummary"

  /workflow/{workflowId}:
    post:
      tags: [Workflows]
      summary: Start a workflow run by id (module or custom-compiled)
      operationId: startWorkflow
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
            enum: [module, release-bump]
            example: release-bump
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRequest"
      responses:
        "202":
          description: Run started asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStartResponse"
        "400":
          description: Missing title or invalid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown workflow id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflow/{workflowId}/{runId}:
    get:
      tags: [Workflows]
      summary: Persisted run state
      operationId: workflowStatus
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
            example: module
        - name: runId
          in: path
          required: true
          schema:
            type: string
            example: run-cli-user-profile
      responses:
        "200":
          description: Current run state
          content:
            application/json:
              schema:
                type: object
                required: [ok, state]
                properties:
                  ok:
                    type: boolean
                  state:
                    $ref: "#/components/schemas/PipelineState"
        "404":
          description: No such run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: State store not wired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workflow/{workflowId}/{runId}/stop:
    post:
      tags: [Workflows]
      summary: Stop an active run (transitions to cancelled)
      operationId: stopWorkflow
      parameters:
        - name: workflowId
          in: path
          required: true
          schema:
            type: string
            example: module
        - name: runId
          in: path
          required: true
          schema:
            type: string
            example: run-cli-user-profile
      responses:
        "200":
          description: Stop signal delivered; the final arrives as pipeline.cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowStopResponse"
        "404":
          description: No such run or workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Run is not active (already terminal); current state is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Store not wired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /internal/workflows/reload:
    post:
      tags: [Internal]
      summary: Re-scan WORKFLOWS_DIR and diff the registry (workflow.* events)
      description: |
        Called by the watch-workflows sidecar process on any change under
        WORKFLOWS_DIR. Loopback-only unless RELOAD_TOKEN is set, in which case
        the header x-reload-token is required.
      operationId: reloadWorkflows
      responses:
        "200":
          description: Registry re-scanned; diffs announced via workflow.* bus events
          content:
            application/json:
              schema:
                type: object
                required: [ok, reindexed]
                properties:
                  ok:
                    type: boolean
                  reindexed:
                    type: boolean
                    const: true
        "401":
          description: Not loopback and no matching RELOAD_TOKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Workflow dir not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /hooks:
    get:
      tags: [Hooks]
      summary: List webhook bindings
      operationId: listHooks
      responses:
        "200":
          description: Current bindings (no secrets, only secretEnv names)
          content:
            application/json:
              schema:
                type: object
                required: [ok, hooks]
                properties:
                  ok:
                    type: boolean
                  hooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/WebhookBinding"
        "501":
          description: Webhooks not wired into this instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Hooks]
      summary: Create a webhook binding
      operationId: createHook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCreateRequest"
      responses:
        "201":
          description: Binding created
          content:
            application/json:
              schema:
                type: object
                required: [ok, id, url]
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
                    description: Binding id, used in the ingress URL.
                    example: hk_mre3xo6q
                  url:
                    type: string
                    description: Relative ingress path.
                    example: /hooks/hk_mre3xo6q
        "400":
          description: Missing source, unknown provider/action/domain or invalid JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Webhooks not wired into this instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /hooks/{hookId}:
    post:
      tags: [Hooks]
      summary: Webhook ingress (HMAC-protected) → entrypoint node → pipeline run
      description: |
        The registry delivers the raw body to the binding: verifies the
        secret (`x-hub-signature-256` HMAC SHA-256 over the raw body when the
        binding pins a `secretEnv`), de-duplicates GitHub/X-Hub deliveries, and
        starts a module run through the webhook entrypoint node. Every
        rejection is published to the bus as `entrypoint.ignored` (nothing is
        silently dropped).
      operationId: hookIngress
      parameters:
        - name: hookId
          in: path
          required: true
          schema:
            type: string
            example: hk_mre3xo6q
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: "Provider-specific payload (generic: task-shaped; github: workflow_run webhook)."
              type: object
      responses:
        "200":
          description: Accepted (started) or duplicate delivery rejected (started=false)
          content:
            application/json:
              schema:
                type: object
                required: [ok, received, started]
                properties:
                  ok:
                    type: boolean
                  received:
                    type: boolean
                  started:
                    type: boolean
                    description: False for a duplicate delivery id.
                  duplicate:
                    type: boolean
        "401":
          description: Bad HMAC signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown or disabled binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Env secret pinned by secretEnv is missing (misconfigured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Hooks]
      summary: Remove a webhook binding
      operationId: removeHook
      parameters:
        - name: hookId
          in: path
          required: true
          schema:
            type: string
            example: hk_mre3xo6q
      responses:
        "200":
          description: Binding removed
          content:
            application/json:
              schema:
                type: object
                required: [ok, removed]
                properties:
                  ok:
                    type: boolean
                  removed:
                    type: string
        "404":
          description: No such binding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "501":
          description: Webhooks not wired into this instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stream:
    get:
      tags: [Stream]
      summary: SSE stream of platform events (snapshot + live)
      description: |
        Server-Sent-Events endpoint used by the web dashboard. It first emits
        a `snapshot` event carrying the recent event history, then pushes live
        events (`task.received`, `pipeline.started`, `pipeline.phase`,
        `pipeline.done`, `pipeline.failed`, `pipeline.cancelled`,
        `pipeline.delivered`, `pipeline.delivery_failed`, `workflow.registered`,
        `workflow.updated`, `workflow.removed`, `workflow.error`,
        `entrypoint.ignored`) as they are published to the bus. Event source
        buffers up to `EVENT_HISTORY_LIMIT` events (default 200).
      responses:
        "200":
          description: text/event-stream connection (kept open; ~15s pings)
          headers:
            Content-Type:
              schema:
                type: string
                example: text/event-stream; charset=utf-8
          content:
            text/event-stream:
              schema:
                type: object
                description: Each `data:` frame is a JSON WorkflowEvent; snapshot frames carry { events }.
              examples:
                snapshot:
                  summary: Initial snapshot frame
                  value:
                    event: snapshot
                    data: '{"events":[{"type":"task.received","task":{"externalId":"t-42","source":"web","title":"Create billing module"}}],"ts":1789297981698}'
                phase:
                  summary: Live phase frame
                  value:
                    event: pipeline.phase
                    data: '{"type":"pipeline.phase","runId":"run-cli-user-profile","phase":"implementation","ts":1789298079000}'

components:
  schemas:
    ModuleAction:
      type: string
      enum: [add, update, delete, decompose]
      description: Module-development strategy.
    ModuleDomain:
      type: string
      enum: [nestjs, dotnet, frontend, general]
      description: Target module domain.
    PipelinePhase:
      type: string
      enum: [spec, planning, tests, implementation, verification, done, failed, cancelled]
      description: Phase machine state of a pipeline run.
    Attachment:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        kind:
          type: string
          enum: [image, file, link]
    Task:
      type: object
      description: Normalised, source-agnostic workflow task.
      required: [externalId, source, title, createdAt]
      properties:
        externalId:
          type: string
          description: Stable id used for dedup (e.g. Trello card id; slug from CLI).
        source:
          type: string
          description: Origin identifier (file, trello, cli, web, …).
        title:
          type: string
        description:
          type: string
        url:
          type: string
        labels:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        createdAt:
          type: string
          format: date-time
        meta:
          type: object
          additionalProperties: true
    TaskInput:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          description: Wire input for POST /task. Only externalId and title are validated.
          required: [externalId, title]
    RunResponse:
      type: object
      description: Result of a one-off agent session.
      required: [ok, prompt, agent, sessionId, response, durationMs]
      properties:
        ok:
          type: boolean
        prompt:
          type: string
          description: The workflow prompt that was executed.
          example: Test
        agent:
          type: string
          description: Resolved agent (default build).
        sessionId:
          type: string
          example: ses_f66c238c6ffeoKoSwtUDOm3mQu
        response:
          type: string
          description: Final assistant text (may be empty).
        durationMs:
          type: integer
    WorkflowSummary:
      type: object
      description: Public face of a registered workflow (built-in module + custom artifacts).
      required: [id, label]
      properties:
        id:
          type: string
          description: Registry key; /workflow/:id routes on it.
          example: release-bump
        label:
          type: string
          example: Release bump
        phases:
          type: array
          description: Explicit phase names (ads to the dashboard); optional.
          items:
            type: string
    WorkflowRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: Run title; slugified to externalId (source cli).
        meta:
          type: object
          additionalProperties: true
          description: Passed to the workflow (module uses meta.action/meta.domain; custom workflows read their own fields).
    WorkflowStartResponse:
      type: object
      required: [ok, workflow, runId]
      properties:
        ok:
          type: boolean
        workflow:
          type: string
          example: release-bump
        runId:
          type: string
          description: run-<source>-<externalId>; source is cli for /workflow/:id.
          example: run-cli-release-1-1-0
        received:
          type: boolean
          description: False when the workflow rejected the task (fire-and-forget paths).
    WorkflowStopResponse:
      type: object
      description: Acknowledgement of a stop request.
      required: [ok, runId, stopped]
      properties:
        ok:
          type: boolean
        runId:
          type: string
        stopped:
          type: boolean
          description: True when the stop signal reached an active run.
    WebhookBinding:
      type: object
      description: Persistent webhook binding. Never contains secrets — only the name of the env variable holding them.
      required: [id, source, provider, enabled, createdAt]
      properties:
        id:
          type: string
          description: hk_… binding id.
          example: hk_mre3xo6q
        source:
          type: string
          description: Origin identifier surfaced as the run's task.source.
          example: github
        provider:
          type: string
          enum: [github, generic]
          description: Payload shape / filter.
        action:
          $ref: "#/components/schemas/ModuleAction"
        domain:
          $ref: "#/components/schemas/ModuleDomain"
        workflow:
          type: string
          description: Workflow to start on ingest; defaults to module when absent.
          example: release-bump
        secretEnv:
          type: string
          description: Env variable holding the HMAC secret; verified at ingress.
          example: GITHUB_WEBHOOK_SECRET
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    WebhookCreateRequest:
      type: object
      required: [source, provider]
      properties:
        source:
          type: string
        provider:
          type: string
          enum: [github, generic]
        workflow:
          type: string
          description: Workflow id to start; module mark.
        action:
          $ref: "#/components/schemas/ModuleAction"
        domain:
          $ref: "#/components/schemas/ModuleDomain"
        secretEnv:
          type: string
        enabled:
          type: boolean
          default: true
    PipelineState:
      type: object
      description: Persisted snapshot of a run.
      required: [runId, phase, externalId, source, attempts]
      properties:
        runId:
          type: string
        phase:
          $ref: "#/components/schemas/PipelinePhase"
        workflow:
          type: string
          description: Owning workflow id (module for the built-in pipeline).
        externalId:
          type: string
        source:
          type: string
        attempts:
          type: integer
          description: Verification retries already used.
        action:
          $ref: "#/components/schemas/ModuleAction"
        domain:
          $ref: "#/components/schemas/ModuleDomain"
        error:
          type: string
          description: Present on failed runs.
    Error:
      type: object
      description: Uniform error body.
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        agents:
          type: array
          description: Known agents on unknown-agent errors.
          items:
            type: string
        domains:
          type: array
          description: Allowed domains on validation errors.
          items:
            type: string
        actions:
          type: array
          description: Allowed actions on validation errors.
          items:
            type: string
  responses:
    UnknownAgent:
      description: Requested agent is not known to the server
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Unexpected error (agents probe, session run)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"